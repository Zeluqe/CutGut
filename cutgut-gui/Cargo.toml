[package]
name = "cutgut-gui"
version = "0.2.1"
edition = "2021"
description = "Native Windows editor for cutting gameplay clips to a size limit"
license = "MIT"
repository = "https://github.com/Zeluqe/CutGut"

[dependencies]
cutgut = { path = "../cutgut-rs" }
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
